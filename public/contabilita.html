    <script>
      // Assicura che la rotta iniziale sia /registrazioni se aperta genericamente
      if (window.location.pathname === '/contabilita' || window.location.pathname === '/contabilita/' || window.location.pathname === '/') {
        window.history.replaceState(null, '', '/registrazioni');
      }

      function renderRecoveryUI(detail) {
        const root = document.getElementById('root');
        console.error("DETAILED ROOT ERROR:", detail);
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          root.innerHTML = '<div style="padding:24px;color:#f87171;background:#0b192c;font-family:monospace;font-size:12px;border:1px solid #ef4444;border-radius:12px;margin:20px;">' +
            '<div style="font-weight:bold;margin-bottom:8px;font-size:14px;">⚠️ Errore caricamento modulo contabile:</div>' +
            '<pre style="white-space:pre-wrap;word-break:break-all;">' + detail + '</pre>' +
            '<button onclick="location.reload()" style="margin-top:12px;padding:8px 16px;background:#f59e0b;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">Riprova</button>' +
          '</div>';
        }
      }

      window.addEventListener('error', function(err) {
        console.error("Contabilità Error Event:", err.message, err.filename, err.lineno, err.colno, err.error ? err.error.stack : 'no stack');
        renderRecoveryUI(err.message + ' at ' + err.filename + ':' + err.lineno + ' ' + (err.error ? err.error.stack : ''));
      });

      window.addEventListener('unhandledrejection', function(event) {
        console.error("Contabilità Unhandled Rejection Reason:", event.reason, event.reason ? event.reason.stack : 'no stack');
        renderRecoveryUI(String(event.reason) + ' ' + (event.reason ? event.reason.stack : ''));
      });
    </script>

    <!-- MOTORE DI PROTEZIONE E SINCRONIZZAZIONE BI-DIREZIONALE DATI CONTABILITÀ -->
    <script>
      (function() {
        const VAULT_KEY = 'gpp_journal_vault';
        const JOURNAL_KEY = 'gpp_journal';
        const CACHE_KEY = 'giampycash_offline_cache';
        const ACCOUNTS_KEY = 'gpp_accounts';
        const BUDGETS_KEY = 'gpp_budgets';
        const DELETED_KEY = 'gpp_deleted_journal_ids';
        const PENDING_OPS_KEY = 'gpp_contabilita_pending_ops';

        function getDeletedIdsSet(extraDeleted) {
          const set = new Set();
          try {
            const raw = JSON.parse(localStorage.getItem(DELETED_KEY) || '[]');
            if (Array.isArray(raw)) raw.forEach(id => set.add(String(id)));
          } catch (e) {}
          if (Array.isArray(extraDeleted)) {
            extraDeleted.forEach(id => set.add(String(id)));
          }
          return set;
        }

        function saveDeletedIdsSet(set) {
          try {
            localStorage.setItem(DELETED_KEY, JSON.stringify(Array.from(set)));
          } catch (e) {}
        }

        function mergeEntryPair(prev, inc) {
          if (!prev) return inc;
          const prevTs = Number(prev.updatedAt || 0);
          const incTs = Number(inc.updatedAt || 0);
          if (prevTs > incTs) return prev;
          return Object.assign({}, prev, inc);
        }

        function collectLocalEntries(extraDeleted) {
          const delSet = getDeletedIdsSet(extraDeleted);
          const map = new Map();
          const sources = [
            localStorage.getItem(VAULT_KEY),
            localStorage.getItem(JOURNAL_KEY),
            localStorage.getItem(CACHE_KEY)
          ];

          sources.forEach(src => {
            if (!src) return;
            try {
              const parsed = JSON.parse(src);
              let list = [];
              if (Array.isArray(parsed)) list = parsed;
              else if (parsed && Array.isArray(parsed.journalEntries)) list = parsed.journalEntries;
              list.forEach(e => {
                if (e && e.id) {
                  const id = String(e.id);
                  if (delSet.has(id)) return;
                  map.set(id, mergeEntryPair(map.get(id), e));
                }
              });
            } catch (err) {}
          });
          return Array.from(map.values()).sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
        }

        function persistToVault(entries, extraDeleted) {
          if (!Array.isArray(entries)) return;
          try {
            const delSet = getDeletedIdsSet(extraDeleted);
            saveDeletedIdsSet(delSet);
            const existing = collectLocalEntries(Array.from(delSet));
            const map = new Map();
            existing.forEach(e => {
              if (e && e.id && !delSet.has(String(e.id))) {
                map.set(String(e.id), e);
              }
            });
            entries.forEach(e => {
              if (e && e.id) {
                const id = String(e.id);
                if (!delSet.has(id)) {
                  map.set(id, mergeEntryPair(map.get(id), e));
                }
              }
            });
            const merged = Array.from(map.values()).sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
            localStorage.setItem(VAULT_KEY, JSON.stringify(merged));
            localStorage.setItem(JOURNAL_KEY, JSON.stringify(merged));
          } catch (e) {}
        }

        function removeLocalEntry(idToRemove) {
          if (!idToRemove) return;
          const idStr = String(idToRemove);
          try {
            const delSet = getDeletedIdsSet([idStr]);
            saveDeletedIdsSet(delSet);
            const filterList = (list) => Array.isArray(list) ? list.filter(e => e && String(e.id) !== idStr) : [];
            const vault = filterList(JSON.parse(localStorage.getItem(VAULT_KEY) || '[]'));
            localStorage.setItem(VAULT_KEY, JSON.stringify(vault));
            const journal = filterList(JSON.parse(localStorage.getItem(JOURNAL_KEY) || '[]'));
            localStorage.setItem(JOURNAL_KEY, JSON.stringify(journal));
            const cacheRaw = localStorage.getItem(CACHE_KEY);
            if (cacheRaw) {
              const cacheObj = JSON.parse(cacheRaw);
              if (cacheObj && Array.isArray(cacheObj.journalEntries)) {
                cacheObj.journalEntries = filterList(cacheObj.journalEntries);
                localStorage.setItem(CACHE_KEY, JSON.stringify(cacheObj));
              }
            }
          } catch (e) {}
        }

        function getPendingOps() {
          try {
            const arr = JSON.parse(localStorage.getItem(PENDING_OPS_KEY) || '[]');
            return Array.isArray(arr) ? arr : [];
          } catch (e) {
            return [];
          }
        }

        function savePendingOps(ops) {
          try {
            localStorage.setItem(PENDING_OPS_KEY, JSON.stringify(ops));
          } catch (e) {}
        }

        function enqueuePendingOp(endpoint, payload) {
          const ops = getPendingOps();
          ops.push({ endpoint, payload, queuedAt: Date.now() });
          savePendingOps(ops);
        }

        // Salva subito quanto attualmente noto nel vault
        const initial = collectLocalEntries();
        if (initial.length > 0) persistToVault(initial);

        function showToast(msg, isSuccess = true) {
          let toast = document.getElementById('gpp-sync-toast');
          if (!toast) {
            toast = document.createElement('div');
            toast.id = 'gpp-sync-toast';
            toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999999;background:rgba(11,25,44,0.96);border:1px solid ' + (isSuccess ? '#10b981' : '#f59e0b') + ';color:#fff;padding:10px 18px;border-radius:14px;font-size:13px;font-family:system-ui,-apple-system,sans-serif;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,0.6);display:flex;align-items:center;gap:8px;backdrop-filter:blur(10px);transition:all 0.3s cubic-bezier(0.16,1,0.3,1);opacity:0;pointer-events:none;';
            document.body.appendChild(toast);
          }
          toast.style.borderColor = isSuccess ? '#10b981' : '#f59e0b';
          toast.innerHTML = (isSuccess ? '✨ ' : '⚠️ ') + msg;
          toast.style.opacity = '1';
          toast.style.transform = 'translateX(-50%) translateY(0)';
          setTimeout(() => {
            if (toast) {
              toast.style.opacity = '0';
              toast.style.transform = 'translateX(-50%) translateY(12px)';
            }
          }, 4500);
        }

        const _origFetch = window.fetch;

        async function postWithRetry(endpoint, payload, maxAttempts = 2) {
          let lastErr = null;
          for (let attempt = 1; attempt <= maxAttempts; attempt++) {
            try {
              const resp = await _origFetch.call(window, endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              if (resp.ok) {
                const json = await resp.json().catch(() => null);
                if (json && json.data && Array.isArray(json.data.journalEntries)) {
                  persistToVault(json.data.journalEntries, json.deletedIds);
                  localStorage.setItem(CACHE_KEY, JSON.stringify(json.data));
                }
                return { ok: true, json };
              }
              lastErr = new Error('HTTP ' + resp.status);
            } catch (err) {
              lastErr = err;
            }
            if (attempt < maxAttempts) {
              await new Promise(r => setTimeout(r, 2000));
            }
          }
          return { ok: false, error: lastErr };
        }

        let isFlushingOps = false;
        async function flushPendingOps() {
          if (isFlushingOps) return;
          const ops = getPendingOps();
          if (ops.length === 0) return;
          isFlushingOps = true;
          try {
            const remaining = [];
            let flushedCount = 0;
            for (let i = 0; i < ops.length; i++) {
              const op = ops[i];
              const res = await postWithRetry(op.endpoint, op.payload, 1);
              if (res.ok) {
                flushedCount++;
              } else {
                remaining.push(...ops.slice(i));
                break;
              }
            }
            savePendingOps(remaining);
            if (flushedCount > 0 && remaining.length === 0) {
              showToast(`Inviati al Cloud ${flushedCount} movimenti in sospeso!`, true);
            }
          } finally {
            isFlushingOps = false;
          }
        }

        async function sendMutationReliable(endpoint, payload) {
          await flushPendingOps();
          const res = await postWithRetry(endpoint, payload, 2);
          if (!res.ok) {
            enqueuePendingOp(endpoint, payload);
            showToast('Server momentaneamente non raggiungibile: movimento salvato su questo dispositivo, verrà inviato appena possibile.', false);
          }
          return res;
        }

        async function syncWithServer() {
          try {
            await flushPendingOps();
            const res = await _origFetch.call(window, '/api/contabilita?_t=' + Date.now(), { cache: 'no-store' });
            if (!res.ok) return null;
            const j = await res.json();
            const serverData = j && j.data ? j.data : null;
            if (!serverData) return null;

            const serverDeleted = Array.isArray(j.deletedIds) ? j.deletedIds : [];
            const delSet = getDeletedIdsSet(serverDeleted);
            saveDeletedIdsSet(delSet);

            const serverJournal = Array.isArray(serverData.journalEntries) ? serverData.journalEntries : [];
            const serverMap = new Map();
            serverJournal.forEach(e => {
              if (e && e.id && !delSet.has(String(e.id))) serverMap.set(String(e.id), e);
            });

            const localEntries = collectLocalEntries(Array.from(delSet));
            const missingOrNewerOnLocal = localEntries.filter(e => {
              const id = String(e.id);
              if (delSet.has(id)) return false;
              const srv = serverMap.get(id);
              if (!srv) return true;
              return Number(e.updatedAt || 0) > Number(srv.updatedAt || 0);
            });

            if (missingOrNewerOnLocal.length > 0) {
              console.log(`[GPP SYNC] Rilevati ${missingOrNewerOnLocal.length} movimenti locali non sul server. Unione in corso...`);
              const payload = {
                accounts: serverData.accounts,
                budgetEntries: serverData.budgetEntries,
                journalEntries: missingOrNewerOnLocal
              };
              const postRes = await _origFetch.call(window, '/api/contabilita/sync-merge', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              if (postRes.ok) {
                const postJson = await postRes.json();
                if (postJson && postJson.data && Array.isArray(postJson.data.journalEntries)) {
                  persistToVault(postJson.data.journalEntries, postJson.deletedIds);
                  localStorage.setItem(CACHE_KEY, JSON.stringify(postJson.data));
                  showToast(`Recuperati ${missingOrNewerOnLocal.length} movimenti da questo dispositivo e salvati su Cloud!`, true);
                  try {
                    if (typeof window.__gppRefreshContabilitaStore === 'function') {
                      window.__gppRefreshContabilitaStore(postJson.data);
                    }
                    window.parent.postMessage({ type: 'gpp-sync-updated', count: postJson.data.journalEntries.length }, '*');
                  } catch (e) {}
                  return postJson.data;
                }
              }
            } else {
              persistToVault(serverJournal, serverDeleted);
              localStorage.setItem(CACHE_KEY, JSON.stringify(serverData));
              if (Array.isArray(serverData.accounts) && serverData.accounts.length > 0) {
                localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(serverData.accounts));
              }
              if (Array.isArray(serverData.budgetEntries)) {
                localStorage.setItem(BUDGETS_KEY, JSON.stringify(serverData.budgetEntries));
              }
            }
            return serverData;
          } catch (err) {
            console.warn('[GPP SYNC] Errore sincronizzazione:', err);
            return null;
          } finally {
            try {
              window.parent.postMessage({ type: 'gpp-sync-done' }, '*');
            } catch (e) {}
          }
        }

        // Esegui sincronizzazione all'avvio ed esponi la Promise per evitare race con React
        window.__gppInitialSyncPromise = syncWithServer();

        window.addEventListener('online', () => {
          flushPendingOps().then(() => syncWithServer());
        });
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            flushPendingOps();
          }
        });

        // Intercetta fetch per proteggere comunque eventuali salvataggi bulk
        window.fetch = async function(...args) {
          const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : '');
          const opt = args[1] || {};

          if (url.includes('/api/contabilita') && opt.method === 'POST' && !url.includes('delete-entry')) {
            try {
              if (opt.body) {
                const b = JSON.parse(opt.body);
                if (b && Array.isArray(b.journalEntries)) persistToVault(b.journalEntries);
              }
            } catch (e) {}
          }

          const resp = await _origFetch.apply(this, args);

          if (url.includes('/api/contabilita') && opt.method === 'POST') {
            try {
              const clone = resp.clone();
              clone.json().then(data => {
                if (data && data.data && Array.isArray(data.data.journalEntries)) {
                  persistToVault(data.data.journalEntries, data.deletedIds);
                  localStorage.setItem(CACHE_KEY, JSON.stringify(data.data));
                }
              }).catch(() => {});
            } catch (e) {}
          }

          return resp;
        };

        // Ascolta comandi dalla finestra genitore (index.html)
        window.addEventListener('message', function(ev) {
          if (ev.data && ev.data.action === 'sync-contabilita') {
            syncWithServer().then((syncedData) => {
              showToast('Sincronizzazione completata!', true);
              if (syncedData && typeof window.__gppRefreshContabilitaStore === 'function') {
                window.__gppRefreshContabilitaStore(syncedData);
              }
              try {
                window.parent.postMessage({ type: 'gpp-sync-done' }, '*');
              } catch (e) {}
            });
          }
        });

        // Oggetto globale di supporto condiviso con index-DjHMptbn.js
        window.gppContabilitaManager = {
          collectLocalEntries,
          persistToVault,
          removeLocalEntry,
          getDeletedIdsSet,
          sendMutationReliable,
          flushPendingOps,
          showToast,
          syncNow: async function() {
            const d = await syncWithServer();
            if (d && typeof window.__gppRefreshContabilitaStore === 'function') {
              window.__gppRefreshContabilitaStore(d);
            } else {
              location.reload();
            }
          },
          exportBackup: function() {
            const data = {
              vault: JSON.parse(localStorage.getItem(VAULT_KEY) || '[]'),
              journal: JSON.parse(localStorage.getItem(JOURNAL_KEY) || '[]'),
              accounts: JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '[]'),
              budgets: JSON.parse(localStorage.getItem(BUDGETS_KEY) || '[]'),
              pendingOps: getPendingOps(),
              backupDate: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `backup_contabilita_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
          }
        };
      })();
    </script>
