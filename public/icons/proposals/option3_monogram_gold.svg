<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Jet Black Onyx -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Champagne / Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <radialGradient id="goldAmbient" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ca8a04" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#713f12" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feGaussianBlur stdDeviation="8" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad3)"/>
  <circle cx="256" cy="240" r="210" fill="url(#goldAmbient)"/>
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="url(#goldBorder)" stroke-width="3"/>

  <!-- Lettera Monogramma 'F' Intrecciata con Arco di Sicurezza Cifrata -->
  <g filter="url(#goldShadow)" transform="translate(140, 110)">
    <!-- Asta Verticale Monogramma 'F' -->
    <rect x="30" y="30" width="38" height="230" rx="19" fill="url(#goldGrad)"/>
    
    <!-- Barra Superiore 'F' con terminale curvo aerodinamico -->
    <path d="M 30 49 C 30 38 40 30 52 30 L 195 30 C 208 30 215 42 208 52 C 196 66 170 68 150 68 L 30 68 Z" fill="url(#goldGrad)"/>

    <!-- Barra Centrale 'F' con gemma centrale -->
    <path d="M 30 135 C 30 126 38 120 48 120 L 140 120 C 152 120 158 132 150 140 C 140 152 120 154 105 154 L 30 154 Z" fill="url(#goldGrad)"/>

    <!-- Lucchetto / Cassaforte Stilizzata a Destra -->
    <g transform="translate(130, 140)">
      <!-- Arco Lucchetto -->
      <path d="M 22 20 C 22 -6 58 -6 58 20" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
      <!-- Corpo Lucchetto -->
      <rect x="10" y="16" width="60" height="52" rx="14" fill="#09090b" stroke="url(#goldGrad)" stroke-width="6"/>
      <!-- Buco Serratura / Brillante -->
      <circle cx="40" cy="38" r="6" fill="url(#goldGrad)"/>
      <path d="M 38 42 L 42 42 L 44 54 L 36 54 Z" fill="url(#goldGrad)"/>
    </g>
  </g>

  <!-- 3 Stelline Dorate per Giampy, Ty e Miki -->
  <circle cx="170" cy="400" r="5" fill="#fde047" opacity="0.8"/>
  <circle cx="256" cy="415" r="7" fill="#fde047"/>
  <circle cx="342" cy="400" r="5" fill="#fde047" opacity="0.8"/>
</svg>
