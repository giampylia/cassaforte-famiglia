<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Midnight Violet to Slate) -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Warm Radiant Glow -->
    <radialGradient id="warmGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Vibrant Sunset Gradient -->
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Golden Accent -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="glassBorder2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <filter id="softGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad2)"/>
  <circle cx="256" cy="245" r="210" fill="url(#warmGlow)"/>
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="url(#glassBorder2)" stroke-width="3"/>

  <!-- Sagoma Focolare & 3 Figure Unite (Giampy, Ty, Miki) -->
  <g filter="url(#softGlow2)">
    <!-- Arco Protettivo a Cupola / Tetto -->
    <path d="M 120 280 C 120 140 392 140 392 280" 
          fill="none" 
          stroke="url(#sunsetGrad)" 
          stroke-width="18" 
          stroke-linecap="round"/>
  </g>

  <!-- 3 Membri di Famiglia Stilizzati con Teste Auree e Corpi Connessi -->
  <g transform="translate(256, 290)">
    <!-- Base Unione Casa -->
    <path d="M -110 50 C -60 20 60 20 110 50" 
          fill="none" 
          stroke="url(#goldAcc)" 
          stroke-width="12" 
          stroke-linecap="round"/>

    <!-- Giampy (Sinistra) -->
    <circle cx="-65" cy="-35" r="24" fill="url(#sunsetGrad)"/>
    <path d="M -92 25 C -92 -10 -38 -10 -38 25" fill="none" stroke="url(#sunsetGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Miki (Centro / Figlio protetto) -->
    <circle cx="0" cy="-65" r="28" fill="url(#goldAcc)"/>
    <path d="M -32 -5 C -32 -45 32 -45 32 -5" fill="none" stroke="url(#goldAcc)" stroke-width="11" stroke-linecap="round"/>

    <!-- Ty (Destra) -->
    <circle cx="65" cy="-35" r="24" fill="url(#sunsetGrad)"/>
    <path d="M 38 25 C 38 -10 92 -10 92 25" fill="none" stroke="url(#sunsetGrad)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Piccola scintilla brillante in alto -->
  <polygon points="256,85 262,97 274,103 262,109 256,121 250,109 238,103 250,97" fill="#ffffff" opacity="0.9"/>
</svg>
