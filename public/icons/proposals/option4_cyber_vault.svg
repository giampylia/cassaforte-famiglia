<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Obsidian -->
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="60%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Neon Emerald & Cyan Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glowing Core -->
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassBorder4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad4)"/>
  <circle cx="256" cy="256" r="200" fill="url(#cyberGlow)"/>
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="url(#glassBorder4)" stroke-width="3"/>

  <!-- Anello Vault Circolare Digitale Neon -->
  <g filter="url(#neonBlur)">
    <!-- Cerchio esterno di sicurezza -->
    <circle cx="256" cy="256" r="145" fill="none" stroke="url(#cyberGrad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="160 30 90 30 200 40"/>
    
    <!-- Cerchio interno di decifratura -->
    <circle cx="256" cy="256" r="95" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="8 12"/>
  </g>

  <!-- Chiave / Serratura Smart Home al Centro -->
  <g transform="translate(256, 256)">
    <!-- Sagoma Casa Minimalista Luminosa -->
    <path d="M -50 10 L 0 -45 L 50 10 L 34 10 L 34 50 L -34 50 L -34 10 Z" 
          fill="none" 
          stroke="url(#cyberGrad)" 
          stroke-width="12" 
          stroke-linejoin="round"/>

    <!-- Lucchetto / Serratura Protetta nel Focolare -->
    <circle cx="0" cy="18" r="8" fill="#ffffff"/>
    <path d="M 0 18 L 0 34" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

    <!-- I 3 Satelliti Orbitali Connessi (Giampy, Ty, Miki) -->
    <circle cx="-135" cy="-60" r="12" fill="#10b981"/>
    <circle cx="0" cy="-145" r="14" fill="#06b6d4"/>
    <circle cx="135" cy="-60" r="12" fill="#3b82f6"/>
  </g>
</svg>
