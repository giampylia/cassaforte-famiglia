  <path d="M50 25 L24 40 L76 40 Z"/>
  <!-- Architrave / Ceiling bar -->
  <rect x="22" y="42" width="56" height="5" rx="1.5"/>
  <!-- 4 Pillars -->
  <rect x="27" y="49" width="7" height="24" rx="1.5"/>
  <rect x="39" y="49" width="7" height="24" rx="1.5"/>
  <rect x="54" y="49" width="7" height="24" rx="1.5"/>
  <rect x="66" y="49" width="7" height="24" rx="1.5"/>
  <!-- Base steps -->
  <rect x="20" y="75" width="60" height="5" rx="1.5"/>
  <rect x="16" y="82" width="68" height="6" rx="2"/>
</svg>
