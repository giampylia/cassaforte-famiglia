<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Full Bleed Solid (No transparent corners!) -->
    <linearGradient id="bgGradMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Emerald Glow -->
    <radialGradient id="ambientGlowMaster" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon Shield Gradient -->
    <linearGradient id="shieldGradMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Heart Cyan Gradient -->
    <linearGradient id="heartGradMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="neonFilterMaster" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. FULL BLEED SOLID BACKGROUND (100% coprente, zero trasparenze sugli angoli) -->
  <rect width="512" height="512" fill="url(#bgGradMaster)"/>
  
  <!-- 2. Sfumatura Ambientale Centrale -->
  <circle cx="256" cy="256" r="220" fill="url(#ambientGlowMaster)"/>

  <!-- 3. Contenuto Principale all'interno della Safe Zone di Android e iOS -->
  <g transform="translate(256, 256) scale(0.92) translate(-256, -256)">
    <!-- Scudo di Protezione Famiglia Neon -->
    <g filter="url(#neonFilterMaster)">
      <path d="M256 85 
               C335 85 410 118 410 215 
               C410 335 288 410 256 438 
               C224 410 102 335 102 215 
               C102 118 177 85 256 85 Z" 
            fill="none" 
            stroke="url(#shieldGradMaster)" 
            stroke-width="20" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>

    <!-- Sagoma Tetto Casa Protetta & Cuore Centrale Intrecciato -->
    <g transform="translate(256, 260)">
      <!-- Tetto Casa / Focolare -->
      <path d="M -96 -32 L 0 -115 L 96 -32" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="16" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            opacity="0.95"/>

      <!-- Cuore Caldo e Luminoso al Centro -->
      <path d="M 0 54 
               C -65 12 -85 -36 -48 -68 
               C -22 -84 0 -48 0 -48 
               C 0 -48 22 -84 48 -68 
               C 85 -36 65 12 0 54 Z" 
            fill="url(#heartGradMaster)"/>

      <!-- I 3 Punti Luminosi Famiglia (Giampy, Ty, Miki) -->
      <circle cx="-38" cy="-26" r="8" fill="#ffffff" opacity="0.95"/>
      <circle cx="0" cy="-48" r="9" fill="#ffffff"/>
      <circle cx="38" cy="-26" r="8" fill="#ffffff" opacity="0.95"/>
    </g>
  </g>
</svg>
