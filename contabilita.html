    <script>
      // Svuota immediatamente la cache del browser
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          for (let r of regs) r.unregister();
        });
      }
      if ('caches' in window) {
        caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
      }
    </script>

    <link rel="stylesheet" crossorigin href="/assets/index-Cp_dnjcW.css?v=20261114_5">
    
    <style>
      /* Palette Midnight Navy & Satin Gold (Nessun Verde) */
      :root {
        --primary: 216 45% 18% !important;
        --primary-foreground: 45 90% 95% !important;
        --ring: 45 80% 55% !important;
        --sidebar-background: 220 50% 10% !important;
        --sidebar-accent: 216 35% 18% !important;

        --accent: 45 85% 55% !important;
      }

      body {
        margin: 0;
        background-color: #061120 !important;
        color: #ffffff;
        -webkit-tap-highlight-color: transparent;
      }

      /* Navbar dell'app contabile in Blu Notte Imperiale & Oro */
      header.bg-primary,
      .bg-primary {
        background: linear-gradient(180deg, #122540 0%, #0a182c 100%) !important;
        border-bottom: 1px solid rgba(245, 211, 101, 0.3) !important;
      }

      /* Quando caricato dentro l'App Giampy (iframe), NON mostrare la barra duplicata */
      #giampy-standalone-bar {
        display: none;
      }

      /* Barra navigazione sezioni contabili fluida e moderna */
      header nav {
        display: flex !important;
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch !important;
        scrollbar-width: none !important;
        gap: 6px !important;
        padding: 4px 2px !important;
      }
      header nav::-webkit-scrollbar {
        display: none !important;
      }
      header nav a {
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 6px 12px !important;
        border-radius: 12px !important;
        font-size: 12px !important;
        font-weight: 600 !important;
        white-space: nowrap !important;
        gap: 6px !important;
        flex-shrink: 0 !important;
      }
      header nav a span {
        display: inline !important;
        font-size: 12px !important;
      }
      header nav a svg {
        width: 14px !important;
        height: 14px !important;
        flex-shrink: 0 !important;
      }
    </style>
    <script>
      // Mostra la barra solo se aperto all'esterno dell'app
      if (window.self === window.top) {
        document.addEventListener('DOMContentLoaded', () => {
          const bar = document.getElementById('giampy-standalone-bar');
          if (bar) bar.style.display = 'flex';
        });
      }
    </script>

        <span>Esci</span>
      </a>
    </div>

    <!-- Container Radice React dell'App Contabile -->
    <div id="root"></div>

    <script>
      // Assicura che la rotta iniziale sia /registrazioni se aperta genericamente
      if (window.location.pathname === '/contabilita' || window.location.pathname === '/contabilita/' || window.location.pathname === '/') {
        window.history.replaceState(null, '', '/registrazioni');
      }

      function renderRecoveryUI(detail) {
        const root = document.getElementById('root');
        console.error("DETAILED ROOT ERROR:", detail);
      }

      window.addEventListener('error', function(err) {
        console.error("Contabilità Error Event:", err.message, err.filename, err.lineno, err.colno, err.error ? err.error.stack : 'no stack');
        renderRecoveryUI(err.message + ' at ' + err.filename + ':' + err.lineno + ' ' + (err.error ? err.error.stack : ''));
      });

      window.addEventListener('unhandledrejection', function(event) {
        console.error("Contabilità Unhandled Rejection Reason:", event.reason, event.reason ? event.reason.stack : 'no stack');
        renderRecoveryUI(String(event.reason) + ' ' + (event.reason ? event.reason.stack : ''));
      });
    </script>

    <!-- Bundle Logico App Contabile -->
    <script type="module" crossorigin src="/assets/index-DjHMptbn.js?v=20261117_fix_sections"></script>
  </body>
